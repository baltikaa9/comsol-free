name: Build FreeFlow (All Platforms)

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    env:
      PYTHONUTF8: "1"

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact-name: freeflow-linux-x64
          - os: windows-latest
            target: win32
            artifact-name: freeflow-windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Cairo (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-cairo

      - name: Configure Cairo DLL path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $cairoPath = Join-Path $env:MSYS2_LOCATION "mingw64\bin"
          $dll = Join-Path $cairoPath "libcairo-2.dll"

          if (-not (Test-Path $dll)) {
            Write-Host "Cairo DLL not found. Searching MSYS2..."
            Get-ChildItem $env:MSYS2_LOCATION -Filter "libcairo-2.dll" -Recurse |
              Select-Object -ExpandProperty FullName
            throw "Cairo DLL not found"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $cairoPath
          Add-Content -Path $env:GITHUB_ENV `
            -Value "CAIROCFFI_DLL_DIRECTORIES=$cairoPath"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Verify Cairo (Windows)
        if: runner.os == 'Windows'
        run: uv run python -c "import cairocffi; print(cairocffi.cairo_version_string())"

      - name: Build with custom script
        env:
          TARGET_PLATFORM: ${{ matrix.target }}
        run: uv run build.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/freeflow/
          retention-days: 30
